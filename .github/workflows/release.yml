# Build & Release chiaki-stream for:
#   - Linux musl (static): x86_64 / aarch64 / armv7 (armhf)
#   - macOS: aarch64
#   - Windows: x86_64 GNU
#
# musl and macOS are separate jobs so neither shows the other's steps:
# build-musl matrix entries each build their own rootfs sysroot
# (docker buildx -> ci/Dockerfile.musl) then cross-compile right after —
# no arch waits on another, no sysroot artifacts are passed around.
# build-macos builds libchiaki natively with build-libchiaki.sh (brew).
# Windows is a separate job because it needs the msys2 shell.
#
# The rootfs is the sysroot: clang --sysroot=<rootfs> for headers,
# LIBCHIAKI_PREFIX=<rootfs>/opt/libchiaki, external deps located by
# pkg-config against the rootfs (PKG_CONFIG_ALLOW_CROSS/SYSROOT_DIR/LIBDIR).
#
# opus: chiaki-stream is a byte pass-through, so the Rust binding is built
# with the "opus" feature OFF. The musl C stack is built with
# CHIAKI_LIB_ENABLE_OPUS=OFF to match; macOS/Windows reuse build-libchiaki.sh
# unchanged (opus ON there) — the binder never references chiaki_opus_*, so
# the linker never extracts those archive members and no libopus link is
# needed on any platform.
name: Build & Release

on:
  workflow_dispatch:

env:
  # tag (v1.10.0) / 分支名 / commit hash 均可, git fetch 直接使用。
  CHIAKI_VERSION: v1.10.0

permissions:
  contents: write

jobs:
  # chiaki-ng 源码获取只做一次 (含子模块), 打包上传; 所有构建 job
  # 下载共享。跨 run 复用由本 job 内的 cache 承担, 命中则跳过 clone。
  fetch-chiaki-ng:
    name: Fetch chiaki-ng
    runs-on: ubuntu-latest
    steps:
      # 本 job 与 chiaki-stream 仓库无关: 只 clone 外部 chiaki-ng 源码,
      # 不需要 actions/checkout (工作区由 runner 预建, 为空)。
      # 源码放在 upload/chiaki-ng: 上传父目录 upload,
      # upload-artifact 剥掉其目录名后 zip 顶层正好是 chiaki-ng/。
      - name: Cache chiaki-ng
        id: cache-chiaki-ng
        uses: actions/cache@v6
        with:
          path: upload
          key: chiaki-ng-${{ env.CHIAKI_VERSION }}

      - name: Fetch chiaki-ng
        if: ${{ steps.cache-chiaki-ng.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -eux
          mkdir -p upload
          git clone --quiet --depth 1 https://github.com/streetpea/chiaki-ng.git upload/chiaki-ng
          git -C upload/chiaki-ng fetch --quiet --depth 1 origin "${{ env.CHIAKI_VERSION }}"
          git -C upload/chiaki-ng checkout --quiet FETCH_HEAD
          git -C upload/chiaki-ng submodule update --init --depth 1 \
            third-party/nanopb third-party/jerasure third-party/gf-complete \
            third-party/curl

      - name: Upload chiaki-ng source
        uses: actions/upload-artifact@v7
        with:
          name: chiaki-ng-${{ env.CHIAKI_VERSION }}
          path: upload
          if-no-files-found: error
          retention-days: 1

  # musl 与 macOS 拆成两个 job: 各自只含自己的步骤, 没有 skipped。
  # musl 每个架构在 job 内先构建自己的 rootfs sysroot (docker buildx ->
  # ci/Dockerfile.musl) 再立即交叉编译, 架构间并行, 互不等待。
  build-musl:
    name: Build (${{ matrix.target }})
    needs: fetch-chiaki-ng
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux/amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            platform: linux/arm64
          # armv7 = hard-float only: Alpine's armv7 C toolchain is ARMHF; a
          # soft-float (musleabi) target cannot link hard-float archives.
          # The arm64 runner runs 32-bit ARM containers natively
          # (CONFIG_COMPAT binfmt), so no qemu setup is needed.
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-24.04-arm
            platform: linux/arm/v7

    steps:
      - uses: actions/checkout@v7

      - name: Download chiaki-ng
        uses: actions/download-artifact@v8
        with:
          name: chiaki-ng-${{ env.CHIAKI_VERSION }}
          path: ${{ runner.temp }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up cargo config
        shell: bash
        run: |
          set -eux
          mkdir -p .cargo
          cp ci/cargo-config.toml .cargo/config.toml

      - name: Install libclang and UPX
        run: sudo apt-get update && sudo apt-get install -y libclang-dev upx-ucl

      - name: Cache musl rootfs
        id: cache-musl-rootfs
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/musl-rootfs
          key: musl-rootfs-${{ matrix.target }}-${{ hashFiles('ci/Dockerfile.musl', 'ci/thread-clockjoin-musl.patch') }}

      # 只有 rootfs cache miss 才需要 Docker 构建, 命中时跳过。
      - name: Set up Docker Buildx
        if: ${{ steps.cache-musl-rootfs.outputs.cache-hit != 'true' }}
        uses: docker/setup-buildx-action@v4

      - name: Build musl rootfs
        if: ${{ steps.cache-musl-rootfs.outputs.cache-hit != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: ci
          file: ci/Dockerfile.musl
          platforms: ${{ matrix.platform }}
          build-contexts: |
            chiaki-ng=${{ runner.temp }}/chiaki-ng
          # v4+ 默认 provenance=true: 带 attestation 的构建经 type=local
          # 导出时不完整 (local exporter 不处理 attestation manifest),
          # 导出目录会缺 /opt/libchiaki — 本地手动 buildx build 不带
          # provenance, 所以本地正常 CI 缺文件。
          provenance: false
          cache-from: type=gha,scope=musl-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=musl-${{ matrix.target }}
          outputs: type=local,dest=${{ runner.temp }}/musl-rootfs

      - name: Build
        shell: bash
        run: |
          set -eux
          # rootfs 完整性尽早暴露 (build.rs 的 panic 不指出根因)。
          for f in opt/libchiaki/include/chiaki/common.h \
                   opt/libchiaki/lib/libchiaki.a \
                   usr/lib/pkgconfig; do
            [ -e "$RUNNER_TEMP/musl-rootfs/$f" ] || {
              echo "musl-rootfs incomplete: missing $f" >&2
              ls -la "$RUNNER_TEMP/musl-rootfs" >&2 || true
              exit 1
            }
          done
          export LIBCHIAKI_PREFIX="$RUNNER_TEMP/musl-rootfs/opt/libchiaki"
          export LIBCHIAKI_STATIC_LIBS=all
          # External deps are located by pkg-config against the rootfs.
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_SYSROOT_DIR="$RUNNER_TEMP/musl-rootfs"
          export PKG_CONFIG_LIBDIR="$RUNNER_TEMP/musl-rootfs/usr/lib/pkgconfig"
          # clang drives both bindgen and the cc-compiled wrapper .c files.
          # Target triples contain '-' which the shell cannot export, so
          # the per-target env names use '_' (cc/bindgen read both forms).
          TRIPLE_U="$(echo '${{ matrix.target }}' | tr '-' '_')"
          export "CC_${TRIPLE_U}=clang"
          export "CFLAGS_${TRIPLE_U}=--target=${{ matrix.target }} --sysroot=$RUNNER_TEMP/musl-rootfs"
          export BINDGEN_EXTRA_CLANG_ARGS="--target=${{ matrix.target }} --sysroot=$RUNNER_TEMP/musl-rootfs"
          cargo build --release --target "${{ matrix.target }}"

      - name: Package artifact
        shell: bash
        run: |
          set -eux
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/chiaki-stream"
          cp "$BIN" "dist/chiaki-stream-${{ matrix.target }}"
          upx --lzma "dist/chiaki-stream-${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: chiaki-stream-${{ matrix.target }}
          path: dist/*

  # macOS: native build-libchiaki.sh (Apple Silicon public runner),
  # build-libchiaki.sh 原样使用 (opus 默认开启)。
  build-macos:
    name: Build (aarch64-apple-darwin)
    needs: fetch-chiaki-ng
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Download chiaki-ng
        uses: actions/download-artifact@v8
        with:
          name: chiaki-ng-${{ env.CHIAKI_VERSION }}
          path: ${{ runner.temp }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Set up cargo config
        shell: bash
        run: |
          set -eux
          mkdir -p .cargo
          cp ci/cargo-config.toml .cargo/config.toml

      - name: Checkout libchiaki
        uses: actions/checkout@v7
        with:
          repository: nanpuyue/libchiaki
          path: libchiaki

      - name: Build libchiaki
        shell: bash
        env:
          LIBCHIAKI_PREFIX: ${{ runner.temp }}/libchiaki-install
          CHIAKI_SRC_DIR: ${{ runner.temp }}/chiaki-ng
          CHIAKI_SKIP_CLONE: 1
        run: |
          set -eux
          cd libchiaki
          # build-libchiaki.sh 原样使用 (opus 默认开启)。绑定层
          # (chiaki-stream 关掉 opus feature) 从不引用 chiaki_opus_* 符号,
          # 静态库惰性抽取不会拉出 opus 成员, 因此无需链接 libopus。
          bash ./build-libchiaki.sh

      - name: Build
        shell: bash
        run: |
          set -eux
          export LIBCHIAKI_PREFIX="$RUNNER_TEMP/libchiaki-install"
          # macOS macho 新版 UPX 已不支持, 不压。
          cargo build --release --target aarch64-apple-darwin

      - name: Package artifact
        shell: bash
        run: |
          set -eux
          mkdir -p dist
          cp "target/aarch64-apple-darwin/release/chiaki-stream" \
             "dist/chiaki-stream-aarch64-apple-darwin"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: chiaki-stream-aarch64-apple-darwin
          path: dist/*

  build-windows:
    name: Build (x86_64-pc-windows-gnu)
    needs: fetch-chiaki-ng
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download chiaki-ng
        uses: actions/download-artifact@v8
        with:
          name: chiaki-ng-${{ env.CHIAKI_VERSION }}
          path: ${{ runner.temp }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Set up cargo config
        shell: bash
        run: |
          set -eux
          mkdir -p .cargo
          cp ci/cargo-config.toml .cargo/config.toml
      # MSYS2 MINGW64 shell for the whole Windows build: build-libchiaki.sh
      # and bindgen need the mingw toolchain on PATH (the script installs
      # its remaining packages itself; mingw clang provides libclang.dll for
      # bindgen). path-type: inherit keeps the Windows PATH (cargo/rustc),
      # which msys2's default "minimal" path type would drop.
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: mingw-w64-x86_64-clang upx
      - name: Checkout libchiaki
        uses: actions/checkout@v7
        with:
          repository: nanpuyue/libchiaki
          path: libchiaki
      - name: Build libchiaki
        shell: msys2 {0}
        env:
          LIBCHIAKI_PREFIX: ${{ runner.temp }}/libchiaki-install
          CHIAKI_SRC_DIR: ${{ runner.temp }}/chiaki-ng
          CHIAKI_SKIP_CLONE: 1
        run: |
          set -eux
          cd libchiaki
          # build-libchiaki.sh 原样使用 (opus 默认开启)。绑定层
          # (chiaki-stream 关掉 opus feature) 从不引用 chiaki_opus_* 符号,
          # 静态库惰性抽取不会拉出 opus 成员, 因此无需链接 libopus。
          bash ./build-libchiaki.sh
      - name: Build
        shell: msys2 {0}
        env:
          LIBCHIAKI_PREFIX: ${{ runner.temp }}/libchiaki-install
        run: |
          set -eux
          cargo build --release --target x86_64-pc-windows-gnu
      - name: Package artifact
        shell: msys2 {0}
        run: |
          set -eux
          mkdir -p dist
          cp "target/x86_64-pc-windows-gnu/release/chiaki-stream.exe" \
             "dist/chiaki-stream-x86_64-pc-windows-gnu.exe"
          upx --lzma "dist/chiaki-stream-x86_64-pc-windows-gnu.exe"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: chiaki-stream-x86_64-pc-windows-gnu
          path: dist/*

  release:
    name: Release
    needs: [build-musl, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          # buildx 的 gha cache 会以 *.dockerbuild artifact 形式上传,
          # 全量下载会把缓存包也拉进来 (大且校验失败), 只取产物。
          pattern: chiaki-stream-*
      - name: Flatten artifacts
        shell: bash
        run: |
          set -eux
          mkdir -p upload
          find dist -type f -exec cp {} upload/ \;
      - name: Create and update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eux
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" --draft --prerelease || true
          gh release upload "$TAG" upload/* --clobber