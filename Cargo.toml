[package]
name = "chiaki-stream"
version = "0.1.0"
edition = "2021"
description = "PlayStation 4/5 Remote Play command-line streaming tool: pairing, wakeup, and pass-through audio/video output as MPEG-TS"
authors = ["南浦月 <nanpuyue@gmail.com>"]
license = "AGPL-3.0"

[dependencies]
libchiaki = { git = "https://github.com/nanpuyue/libchiaki", default-features = false }
clap = { version = "4", features = ["derive"] }
mpeg2ts = "0.6"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
