[package]
name = "chiaki-stream"
version = "0.1.0"
edition = "2021"
description = "PlayStation 4/5 Remote Play 命令行串流工具: 配对注册、主机唤醒、音视频封装 MPEG-TS 输出"
authors = ["南浦月 <nanpuyue@gmail.com>"]
license = "AGPL-3.0"

[dependencies]
libchiaki = { path = "../libchiaki" }
clap = { version = "4", features = ["derive"] }
mpeg2ts = "0.6"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
